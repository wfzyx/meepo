version: '3.8'

services:
  meepo:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: meepo
    restart: unless-stopped
    network_mode: "host"
    environment:
      - MEEPO_HOST=127.0.0.1
      - MEEPO_PORT=8081
      - MEEPO_LLAMA_URL=http://127.0.0.1:8080/v1
      - MEEPO_VON_URL=http://127.0.0.1:8000/v1/systemone
